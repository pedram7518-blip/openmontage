<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:"DejaVu Sans",Arial,sans-serif}
.c{position:relative;width:1280px;height:720px;background:radial-gradient(ellipse at 62% 45%,#2ff0e0 0%,#00b8c4 45%,#006a80 100%)}
.txt{position:absolute;left:46px;top:40px;font-weight:900;font-size:150px;line-height:.92;color:#ffe600;
 -webkit-text-stroke:14px #000;paint-order:stroke fill;letter-spacing:-2px;transform:rotate(-4deg);text-shadow:10px 12px 0 rgba(0,0,0,.45)}
.face{position:absolute;right:70px;top:70px;width:430px;height:560px;border-radius:200px 200px 170px 170px;
 background:repeating-linear-gradient(45deg,#d9d9d9 0 22px,#bdbdbd 22px 44px);border:8px dashed #ff1744;
 display:flex;align-items:flex-start;padding-top:90px;box-sizing:border-box;justify-content:center;text-align:center;font:800 30px/1.25 "DejaVu Sans",sans-serif;color:#222}
.shoulders{position:absolute;right:0;bottom:-40px;width:640px;height:200px;background:#1b1b1b;border-radius:300px 300px 0 0}
.lbl{position:absolute;font:700 20px "DejaVu Sans",sans-serif;color:#000;background:#fff;padding:4px 10px;border:3px solid #ff1744}
</style></head><body><div class="c">
<div class="shoulders"></div>
<div class="face">FACE PLACEHOLDER<br>(you)<br><br>eyes DOWN at own hand<br>one brow up, lips parted<br>"…wait."</div>
<svg width="1280" height="720" style="position:absolute;left:0;top:0">
 <!-- forearm -->
 <path d="M900 720 L760 520 L860 470 L1010 700 Z" fill="#e0a982" stroke="#000" stroke-width="8"/>
 <!-- fist -->
 <rect x="540" y="360" width="290" height="230" rx="70" fill="#f0b991" stroke="#000" stroke-width="9"/>
 <!-- curled fingers (3) -->
 <rect x="560" y="455" width="190" height="52" rx="26" fill="#e7ab82" stroke="#000" stroke-width="7"/>
 <rect x="560" y="505" width="180" height="52" rx="26" fill="#e7ab82" stroke="#000" stroke-width="7"/>
 <rect x="570" y="553" width="160" height="48" rx="24" fill="#e7ab82" stroke="#000" stroke-width="7"/>
 <!-- index finger pointing out at viewer -->
 <rect x="330" y="372" width="260" height="78" rx="39" fill="#f3c19b" stroke="#000" stroke-width="9"/>
 <ellipse cx="350" cy="411" rx="20" ry="28" fill="#f7d4b8" stroke="#000" stroke-width="5"/>
 <!-- thumb -->
 <rect x="600" y="320" width="150" height="62" rx="31" fill="#f0b991" stroke="#000" stroke-width="8" transform="rotate(-18 675 351)"/>
 <!-- red circle around curled fingers -->
 <ellipse cx="650" cy="510" rx="150" ry="95" fill="none" stroke="#ff1744" stroke-width="16"/>
 <!-- red arrow -->
 <path d="M300 640 Q420 640 480 560" fill="none" stroke="#ff1744" stroke-width="20" stroke-linecap="round"/>
 <path d="M455 548 L505 540 L492 590 Z" fill="#ff1744" stroke="#ff1744" stroke-width="8" stroke-linejoin="round"/>
</svg>
<div class="txt">IS IT<br>ME?</div>
<div class="lbl" style="left:30px;top:670px">HAND PLACEHOLDER: real hand, 20cm from lens</div>
</div></body></html>
